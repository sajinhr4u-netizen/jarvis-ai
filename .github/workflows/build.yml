name: Build JARVIS.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub website

jobs:
  build:
    runs-on: windows-latest   # Real Windows machine in cloud

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install psutil
          pip install pyttsx3
          pip install SpeechRecognition
          pip install pyaudio
          pip install pyautogui
          pip install pyperclip
          pip install Pillow
          pip install numpy
          pip install requests

      - name: Build JARVIS.exe with PyInstaller
        run: |
          pyinstaller --onefile `
            --windowed `
            --name JARVIS `
            --hidden-import=pyttsx3.drivers `
            --hidden-import=pyttsx3.drivers.sapi5 `
            --hidden-import=speech_recognition `
            --hidden-import=psutil `
            --hidden-import=pyautogui `
            --hidden-import=numpy `
            --hidden-import=PIL `
            --hidden-import=tkinter `
            --hidden-import=tkinter.ttk `
            --hidden-import=queue `
            --hidden-import=threading `
            --hidden-import=webbrowser `
            --hidden-import=subprocess `
            --hidden-import=urllib.request `
            jarvis.py

      - name: Upload JARVIS.exe as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-exe
          path: dist/JARVIS.exe
          retention-days: 90   # available to download for 90 days
